<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Update Users</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    #usersContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }
    .user-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .user-card img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
    }
    .user-input,
    .user-card select {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #d8d8d8;
      padding: 8px 12px;
    }
    .update-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #message {
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card">
      <div class="toolbar" style="justify-content: space-between;">
        <div>
          <h1>Update Users</h1>
          <p class="muted">Adjust contact details or permissions for any account.</p>
        </div>
        <button class="btn" id="reload" type="button" onclick="loadUsers()">Reload Users</button>
      </div>
      <div id="usersContainer"></div>
      <p id="message"></p>
    </section>
  </main>

  <script>
    async function loadUsers() {
      const container = document.getElementById('usersContainer');
      const msg = document.getElementById('message');
      container.innerHTML = '';
      msg.textContent = '';

      try {
        const response = await fetch('http://localhost:4000/users');
        const data = await response.json();

        if (!response.ok) {
          msg.style.color = 'red';
          msg.textContent = `Error: ${data.error || 'Failed to load users'}`;
          return;
        }

        if (data.length === 0) {
          msg.textContent = 'No users found.';
          return;
        }

        data.forEach((user) => {
          const card = document.createElement('div');
          card.className = 'user-card';

          const avatar = document.createElement('img');
          avatar.src = user.avatar || 'https://via.placeholder.com/100?text=User';
          card.appendChild(avatar);

          const name = document.createElement('div');
          name.className = 'user-name';
          name.textContent = user.username;
          card.appendChild(name);

          const emailInput = document.createElement('input');
          emailInput.className = 'user-input';
          emailInput.value = user.email || '';
          emailInput.placeholder = 'Email';
          card.appendChild(emailInput);

          const phoneInput = document.createElement('input');
          phoneInput.className = 'user-input';
          phoneInput.value = user.phone || '';
          phoneInput.placeholder = 'Phone';
          card.appendChild(phoneInput);

          const roleSelect = document.createElement('select');
          roleSelect.className = 'user-input';
          ['coach', 'manager', 'admin', 'player', 'parent'].forEach((r) => {
            const option = document.createElement('option');
            option.value = r;
            option.text = r.charAt(0).toUpperCase() + r.slice(1);
            if (user.role === r) option.selected = true;
            roleSelect.appendChild(option);
          });
          card.appendChild(roleSelect);

          const updateBtn = document.createElement('button');
          updateBtn.className = 'update-btn';
          updateBtn.textContent = 'Update User';
          updateBtn.onclick = () => updateUser(user.username, {
            email: emailInput.value,
            phone: phoneInput.value,
            role: roleSelect.value
          });
          card.appendChild(updateBtn);

          container.appendChild(card);
        });
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Error connecting to server.';
        console.error(err);
      }
    }

    async function updateUser(username, updateData) {
      const msg = document.getElementById('message');
      msg.textContent = '';

      try {
        const response = await fetch(`http://localhost:4000/users/${username}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updateData)
        });

        const data = await response.json();

        if (response.ok) {
          msg.style.color = 'green';
          msg.textContent = data.message || `User "${username}" updated successfully!`;
          loadUsers();
        } else {
          msg.style.color = 'red';
          msg.textContent = `Error: ${data.error || 'Failed to update user'}`;
        }
      } catch (err) {
        console.error('Error updating user:', err);
        msg.style.color = 'red';
        msg.textContent = 'Error: Unable to connect to server.';
      }
    }

    window.onload = loadUsers;
  </script>
</body>
</html>
