<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Update Users</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      background-color: #007bff;
      color: white;
      padding: 15px 0;
      margin-bottom: 20px;
    }

    #usersContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 10px;
    }

    .user-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 280px;
      padding: 20px;
      text-align: center;
      position: relative;
      transition: transform 0.2s ease;
    }

    .user-card:hover {
      transform: translateY(-4px);
    }

    .user-card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid #ccc;
    }

    .user-name {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }

    .user-input {
      width: 90%;
      margin: 5px 0;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .update-btn {
      background: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 15px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .update-btn:hover {
      background: #218838;
    }

    button#reload {
      margin-bottom: 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
    }

    button#reload:hover {
      background: #0069d9;
    }

    #message {
      margin-top: 20px;
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Update Users</h1>
  <button id="reload" onclick="loadUsers()">Reload Users</button>
  <div id="usersContainer"></div>
  <p id="message"></p>

  <script>
    async function loadUsers() {
      const container = document.getElementById('usersContainer');
      const msg = document.getElementById('message');
      container.innerHTML = '';
      msg.textContent = '';

      try {
        const response = await fetch('http://localhost:4000/users');
        const data = await response.json();

        if (!response.ok) {
          msg.textContent = `Error: ${data.error || 'Failed to load users'}`;
          return;
        }

        if (data.length === 0) {
          msg.textContent = 'No users found.';
          return;
        }

        data.forEach(user => {
          const card = document.createElement('div');
          card.className = 'user-card';

          const avatar = document.createElement('img');
          avatar.src = user.avatar || 'https://via.placeholder.com/100?text=User';
          card.appendChild(avatar);

          const name = document.createElement('div');
          name.className = 'user-name';
          name.textContent = user.username;
          card.appendChild(name);

          // Editable fields
          const emailInput = document.createElement('input');
          emailInput.className = 'user-input';
          emailInput.value = user.email || '';
          emailInput.placeholder = 'Email';
          card.appendChild(emailInput);

          const phoneInput = document.createElement('input');
          phoneInput.className = 'user-input';
          phoneInput.value = user.phone || '';
          phoneInput.placeholder = 'Phone';
          card.appendChild(phoneInput);

          const roleSelect = document.createElement('select');
          roleSelect.className = 'user-input';
          ['coach','manager','admin','player','parent'].forEach(r => {
            const option = document.createElement('option');
            option.value = r;
            option.text = r.charAt(0).toUpperCase() + r.slice(1);
            if (user.role === r) option.selected = true;
            roleSelect.appendChild(option);
          });
          card.appendChild(roleSelect);

          // Update button
          const updateBtn = document.createElement('button');
          updateBtn.className = 'update-btn';
          updateBtn.textContent = 'Update User';
          updateBtn.onclick = () => updateUser(user.username, {
            email: emailInput.value,
            phone: phoneInput.value,
            role: roleSelect.value
          });
          card.appendChild(updateBtn);

          container.appendChild(card);
        });

      } catch (err) {
        msg.textContent = 'Error connecting to server.';
        console.error(err);
      }
    }

    async function updateUser(username, updateData) {
      const msg = document.getElementById('message');
      msg.textContent = '';

      try {
        const response = await fetch(`http://localhost:4000/users/${username}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updateData)
        });

        const data = await response.json();

        if (response.ok) {
          msg.style.color = 'green';
          msg.textContent = data.message || `User "${username}" updated successfully!`;
          loadUsers();
        } else {
          msg.style.color = 'red';
          msg.textContent = `Error: ${data.error || 'Failed to update user'}`;
        }
      } catch (err) {
        console.error('Error updating user:', err);
        msg.style.color = 'red';
        msg.textContent = 'Error: Unable to connect to server.';
      }
    }

    // Load users on page load
    window.onload = loadUsers;
  </script>
</body>
</html>
