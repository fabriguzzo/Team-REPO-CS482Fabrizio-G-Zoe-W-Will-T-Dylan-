<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manage Users</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    #usersContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .user-card {
      background: #fffaf5;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid #f0e5d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .user-card img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
    }
    .delete-btn {
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      background: #d9534f;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: #c2413d;
    }
    #message {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/admin" class="auth-link">Admin</a>
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card">
      <div class="toolbar" style="justify-content: space-between;">
        <div>
          <h1 style="margin-bottom:4px;">Manage Users</h1>
          <p class="muted">Review every registered account and remove access when necessary.</p>
        </div>
        <button class="btn" id="reload" type="button" onclick="loadUsers()">Reload Users</button>
      </div>
      <div id="usersContainer"></div>
      <p id="message"></p>
    </section>
  </main>

  <script>
    async function loadUsers() {
      const container = document.getElementById('usersContainer');
      const msg = document.getElementById('message');
      container.innerHTML = '';
      msg.textContent = '';

      try {
        const response = await fetch('http://localhost:4000/users');
        const data = await response.json();

        if (!response.ok) {
          msg.textContent = `Error: ${data.error || 'Failed to load users'}`;
          return;
        }

        if (data.length === 0) {
          msg.textContent = 'No users found.';
          return;
        }

        data.forEach(user => {
          const card = document.createElement('div');
          card.className = 'user-card';

          const avatar = document.createElement('img');
          avatar.src = user.avatar || 'https://via.placeholder.com/100?text=User';
          card.appendChild(avatar);

          const name = document.createElement('div');
          name.className = 'user-name';
          name.textContent = user.username;
          card.appendChild(name);

          const email = document.createElement('div');
          email.className = 'user-email';
          email.textContent = user.email || 'No email';
          card.appendChild(email);

          const role = document.createElement('div');
          role.className = 'user-role';
          role.textContent = `Role: ${user.role || 'User'}`;
          card.appendChild(role);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = 'Delete User';
          deleteBtn.onclick = () => deleteUser(user.username);
          card.appendChild(deleteBtn);

          container.appendChild(card);
        });
      } catch (err) {
        msg.textContent = 'Error connecting to server.';
        console.error(err);
      }
    }

    async function deleteUser(username) {
      if (!confirm(`Are you sure you want to delete user "${username}"?`)) return;

      const msg = document.getElementById('message');
      msg.textContent = '';

      try {
        const response = await fetch(`http://localhost:4000/users/${username}`, {
          method: 'DELETE',
        });
        const data = await response.json();

        if (response.ok) {
          msg.style.color = 'green';
          msg.textContent = data.message || `User "${username}" deleted successfully!`;
          loadUsers(); // reload updated list
        } else {
          msg.style.color = 'red';
          msg.textContent = `Error: ${data.error || 'Failed to delete user'}`;
        }
      } catch (err) {
        console.error('Error deleting user:', err);
        msg.style.color = 'red';
        msg.textContent = 'Error: Unable to connect to server.';
      }
    }
    // Load users on page load
    window.onload = loadUsers;
  </script>
</body>
</html>
