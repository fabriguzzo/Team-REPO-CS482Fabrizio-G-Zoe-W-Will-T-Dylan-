<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manage Users</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      background-color: #dc3545;
      color: white;
      padding: 15px 0;
      margin-bottom: 20px;
    }

    #usersContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 10px;
    }

    .user-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 250px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s ease;
      position: relative;
    }

    .user-card:hover {
      transform: translateY(-4px);
    }

    .user-card img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid #ccc;
    }

    .user-name {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .user-email {
      font-size: 14px;
      color: #666;
      margin-bottom: 6px;
    }

    .user-role {
      font-size: 14px;
      color: #444;
      margin-bottom: 10px;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .delete-btn:hover {
      background: #c82333;
    }

    #message {
      margin-top: 20px;
      color: red;
      font-weight: bold;
    }

    button#reload {
      margin-bottom: 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
    }

    button#reload:hover {
      background: #0069d9;
    }
  </style>
</head>
<body>
  <h1>Manage Users</h1>
  <button id="reload" onclick="loadUsers()">Reload Users</button>
  <div id="usersContainer"></div>
  <p id="message"></p>

  <script>
    async function loadUsers() {
      const container = document.getElementById('usersContainer');
      const msg = document.getElementById('message');
      container.innerHTML = '';
      msg.textContent = '';

      try {
        const response = await fetch('http://localhost:4000/users');
        const data = await response.json();

        if (!response.ok) {
          msg.textContent = `Error: ${data.error || 'Failed to load users'}`;
          return;
        }

        if (data.length === 0) {
          msg.textContent = 'No users found.';
          return;
        }

        data.forEach(user => {
          const card = document.createElement('div');
          card.className = 'user-card';

          const avatar = document.createElement('img');
          avatar.src = user.avatar || 'https://via.placeholder.com/100?text=User';
          card.appendChild(avatar);

          const name = document.createElement('div');
          name.className = 'user-name';
          name.textContent = user.username;
          card.appendChild(name);

          const email = document.createElement('div');
          email.className = 'user-email';
          email.textContent = user.email || 'No email';
          card.appendChild(email);

          const role = document.createElement('div');
          role.className = 'user-role';
          role.textContent = `Role: ${user.role || 'User'}`;
          card.appendChild(role);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = 'Delete User';
          deleteBtn.onclick = () => deleteUser(user.username);
          card.appendChild(deleteBtn);

          container.appendChild(card);
        });
      } catch (err) {
        msg.textContent = 'Error connecting to server.';
        console.error(err);
      }
    }

    async function deleteUser(username) {
      if (!confirm(`Are you sure you want to delete user "${username}"?`)) return;

      const msg = document.getElementById('message');
      msg.textContent = '';

      try {
        const response = await fetch(`http://localhost:4000/users/${username}`, {
          method: 'DELETE',
        });
        const data = await response.json();

        if (response.ok) {
          msg.style.color = 'green';
          msg.textContent = data.message || `User "${username}" deleted successfully!`;
          loadUsers(); // reload updated list
        } else {
          msg.style.color = 'red';
          msg.textContent = `Error: ${data.error || 'Failed to delete user'}`;
        }
      } catch (err) {
        console.error('Error deleting user:', err);
        msg.style.color = 'red';
        msg.textContent = 'Error: Unable to connect to server.';
      }
    }
    // Load users on page load
    window.onload = loadUsers;
  </script>
</body>
</html>
