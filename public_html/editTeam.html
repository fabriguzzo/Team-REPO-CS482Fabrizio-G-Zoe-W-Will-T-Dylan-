<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Team</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    #playerList {
      text-align: left;
      background: #fff7f0;
      color: #222;
      padding: 12px;
      border-radius: 12px;
      max-height: 240px;
      overflow: auto;
      border: 1px solid #f0e3d6;
    }
    #message {
      font-weight: 600;
      text-align: center;
    }
    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }
    .pill-btn {
      border: 1px solid var(--accent-dark);
      background: transparent;
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .pill-btn:hover {
      background: #ffe3c7;
    }
    .roster-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .roster-actions select {
      flex: 1;
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid #d7d7d7;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card form-card">
      <h1>Edit Team</h1>
      <p class="muted">Update a roster, upload a fresh logo, or add youth accounts to keep everyone synced.</p>
      <form id="editForm" class="form-grid" enctype="multipart/form-data">
        <label for="name">Team Name</label>
        <input type="text" id="name" name="name" required>

        <label for="manager">Manager</label>
        <input type="text" id="manager" name="manager">

        <label for="logo">Upload New Logo</label>
        <input type="file" id="logo" name="logo" accept="image/*">

        <h3>Players</h3>
        <div id="playerList"></div>
        <div class="roster-actions">
          <select id="childSelect">
            <option value="">-- Select Child User --</option>
          </select>
          <button type="button" class="btn" id="addPlayerBtn">Add</button>
        </div>

        <button type="submit" class="btn">Save Changes</button>
      </form>

      <p id="message"></p>
      <button class="btn" type="button" onclick="window.location.href='teamView.html'">Back to Teams</button>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const teamId = params.get('id');
    const form = document.getElementById('editForm');
    const msg = document.getElementById('message');
    const playerListEl = document.getElementById('playerList');
    const addPlayerBtn = document.getElementById('addPlayerBtn');
    let players = [];

    async function loadTeam() {
      try {
        const res = await fetch(`http://localhost:4000/teams/${teamId}`);
        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || 'Failed to load team.';
          return;
        }

        document.getElementById('name').value = data.name || '';
        document.getElementById('manager').value = data.manager || '';
        players = Array.isArray(data.players) ? data.players.slice() : [];
        renderPlayers();
      } catch (err) {
        msg.textContent = 'Error fetching team data.';
      }
    }

    async function loadChildUsers() {
      try {
        const res = await fetch('http://localhost:4000/users');
        const users = await res.json();
        const childSelect = document.getElementById('childSelect');
        childSelect.innerHTML = '<option value="">-- Select Child User --</option>';

        users.filter(u => u.role === 'child').forEach(u => {
          const opt = document.createElement('option');
          opt.value = u.username;
          opt.textContent = u.username;
          childSelect.appendChild(opt);
        });
      } catch (err) {
        console.error('Error loading child users:', err);
      }
    }

    function renderPlayers() {
      playerListEl.innerHTML = '';
      if (!players.length) {
        const empty = document.createElement('div');
        empty.textContent = 'No players yet.';
        empty.className = 'muted';
        playerListEl.appendChild(empty);
        return;
      }
      players.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'player-row';
        const name = document.createElement('span');
        name.textContent = p;
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.textContent = 'Remove';
        rm.className = 'pill-btn';
        rm.addEventListener('click', () => {
          players.splice(idx, 1);
          renderPlayers();
        });
        row.appendChild(name);
        row.appendChild(rm);
        playerListEl.appendChild(row);
      });
    }

    addPlayerBtn.addEventListener('click', () => {
      const childSelect = document.getElementById('childSelect');
      const val = childSelect.value;
      if (!val) return;
      players.push(val);
      childSelect.value = '';
      renderPlayers();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';

      const formData = new FormData();
      formData.append('_id', teamId);
      formData.append('name', form.name.value.trim());
      formData.append('manager', form.manager.value.trim());
      if (form.logo.files[0]) {
        formData.append('logo', form.logo.files[0]);
      }
      formData.append('players', JSON.stringify(players));

      try {
        const res = await fetch('http://localhost:4000/teams', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (res.ok) {
          msg.style.color = 'green';
          msg.textContent = 'Team updated successfully!';
          setTimeout(() => window.location.href = 'teamView.html', 1000);
        } else {
          msg.style.color = 'red';
          msg.textContent = data.error || 'Failed to update team.';
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Error connecting to server.';
      }
    });

    window.onload = async () => {
      await loadChildUsers();
      await loadTeam();
    };
  </script>
</body>
</html>
