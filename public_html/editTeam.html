<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Team</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      background-color: orange;
      color: black;
      padding: 15px;
      margin: 0;
    }

    form {
      background-color: orange;
      width: 400px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 10px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      color: black;
      font-weight: bold;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: none;
      border-radius: 5px;
    }

    button {
      background-color: #ffb300;
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #a06e0b;
    }

    #message {
      color: white;
      margin-top: 15px;
      font-weight: bold;
    }

    .back-btn {
      background-color: #ffb300;
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    .back-btn:hover {
      background-color: #a06e0b;
    }
  </style>
</head>
<body>
  <h1>Edit Team</h1>

  <form id="editForm" enctype="multipart/form-data">
    <label for="name">Team Name</label>
    <input type="text" id="name" name="name" required>

    <label for="manager">Manager</label>
    <input type="text" id="manager" name="manager">

    <label for="logo">Upload New Logo</label>
    <input type="file" id="logo" name="logo" accept="image/*">

    <hr>
    <h3 style="color:black;">Players</h3>
    <div id="playerList" style="text-align:left; background:#fff; color:#000; padding:10px; border-radius:8px; max-height:220px; overflow:auto;"></div>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <input type="text" id="newPlayer" placeholder="Add player name" style="flex:1;">
      <button type="button" id="addPlayerBtn">Add</button>
    </div>

    <button type="submit">Save Changes</button>
  </form>

  <p id="message"></p>
  <button class="back-btn" onclick="window.location.href='viewTeams'">← Back to Teams</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const teamId = params.get('id');
    const form = document.getElementById('editForm');
    const msg = document.getElementById('message');
    const playerListEl = document.getElementById('playerList');
    const newPlayerInput = document.getElementById('newPlayer');
    const addPlayerBtn = document.getElementById('addPlayerBtn');
    let players = [];

    async function loadTeam() {
      try {
        const res = await fetch(`http://localhost:4000/teams/${teamId}`);
        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || 'Failed to load team.';
          return;
        }

        document.getElementById('name').value = data.name || '';
        document.getElementById('manager').value = data.manager || '';
        players = Array.isArray(data.players) ? data.players.slice() : [];
        renderPlayers();
      } catch (err) {
        msg.textContent = 'Error fetching team data.';
      }
    }

    function renderPlayers(){
      playerListEl.innerHTML = '';
      if (!players.length) {
        const empty = document.createElement('div');
        empty.textContent = 'No players yet.';
        empty.style.color = '#333';
        playerListEl.appendChild(empty);
        return;
      }
      players.forEach((p, idx) => {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.alignItems = 'center';
        row.style.justifyContent = 'space-between';
        row.style.padding = '6px 0';
        const name = document.createElement('span');
        name.textContent = p;
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.textContent = 'Remove';
        rm.style.background = '#fff';
        rm.style.border = '1px solid #a06e0b';
        rm.style.borderRadius = '6px';
        rm.style.cursor = 'pointer';
        rm.addEventListener('click', () => { players.splice(idx,1); renderPlayers(); });
        row.appendChild(name);
        row.appendChild(rm);
        playerListEl.appendChild(row);
      });
    }

    addPlayerBtn.addEventListener('click', () => {
      const val = newPlayerInput.value.trim();
      if (!val) return;
      players.push(val);
      newPlayerInput.value = '';
      renderPlayers();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';

      const formData = new FormData();
      formData.append('_id', teamId);
      formData.append('name', form.name.value.trim());
      formData.append('manager', form.manager.value.trim());
      if (form.logo.files[0]) {
        formData.append('logo', form.logo.files[0]);
      }
      formData.append('players', JSON.stringify(players));

      try {
        const res = await fetch('http://localhost:4000/teams', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (res.ok) {
          msg.style.color = 'green';
          msg.textContent = 'Team updated successfully!';
          setTimeout(() => window.location.href = 'teamView.html', 1000);
        } else {
          msg.style.color = 'red';
          msg.textContent = data.error || 'Failed to update team.';
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Error connecting to server.';
      }
    });

    window.onload = loadTeam;
  </script>
</body>
</html>
