<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add User</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    #message {
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card form-card">
      <h1>Add a User</h1>
      <p class="muted">Create fully privileged staff accounts.              </p>
      <form id="userForm" class="form-grid">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Username" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email" required />

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Age" min="0" required />

        <button type="submit" class="btn">Add User</button>
      </form>
      <p id="message"></p>
    </section>
  </main>

  <script>
    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const ageVal = parseInt(document.getElementById('age').value, 10);
      const msg = document.getElementById('message');
      if (Number.isNaN(ageVal)) {
        msg.style.color = 'red';
        msg.textContent = 'Error: Age is required to sign up';
        return;
      }
      if (ageVal < 18) {
        msg.style.color = 'red';
        msg.textContent = 'Error: Cannot sign up as minor; must be under a parent';
        return;
      }
      const user = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
        email: document.getElementById('email').value.trim(),
        age: ageVal
      };

      const response = await fetch('http://localhost:4000/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(user)
      });

      const data = await response.json();

      if (response.ok) {
        msg.style.color = 'green';
        msg.textContent = 'User added successfully! Redirecting...';
        try {
          const safeUser = data && data.user ? { ...data.user } : null;
          if (safeUser && 'password' in safeUser) delete safeUser.password;
          if (safeUser) localStorage.setItem('currentUser', JSON.stringify(safeUser));
        } catch (err) {
          console.warn('Unable to store user in localStorage', err);
        }
        document.getElementById('userForm').reset();
        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      } else {
        msg.style.color = 'red';
        msg.textContent = `Error: ${data.error || 'Failed to add user'}`;
      }
    });
  </script>
</body>
</html>
