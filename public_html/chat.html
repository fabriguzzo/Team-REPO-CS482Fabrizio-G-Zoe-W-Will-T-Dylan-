<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Games & Chat</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .chat-layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
      gap: 24px;
    }
    .games-panel h2,
    .chat-panel h2 {
      margin-top: 0;
    }
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 65vh;
      overflow-y: auto;
    }
    .game-card {
      border: 1px solid #f0e6dd;
      border-left: 5px solid var(--accent);
      border-radius: 16px;
      padding: 16px;
      background: #fffaf5;
    }
    .game-card strong {
      color: var(--accent-dark);
    }
    .chat-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #chat-feed {
      flex: 1;
      border: 1px solid #eee;
      border-radius: 16px;
      padding: 12px 16px;
      background: #fafafa;
      overflow-y: auto;
      min-height: 320px;
    }
    #chat-feed p {
      margin: 6px 0;
    }
    .message-input {
      display: flex;
      gap: 10px;
    }
    .message-input input {
      flex: 1;
      border: 1px solid #d7d7d7;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
    }
    .status-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: #f3d7c0;
      color: var(--accent-dark);
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card">
      <h1>Live Games & Chat</h1>
      <p class="muted">Follow every matchup on the left while discussing plays with your staff and teammates in the live chat.</p>
    </section>

    <section class="chat-layout">
      <div class="card games-panel">
        <div class="grid-two">
          <div>
            <h2>Live Games <span class="status-tag">In Progress</span></h2>
            <div id="live-games" class="game-list"></div>
          </div>
          <div>
            <h2>Finished Games</h2>
            <div id="finished-games" class="game-list"></div>
          </div>
        </div>
      </div>

      <div class="card chat-panel">
        <h2>Team Chat</h2>
        <div id="chat-feed"></div>
        <div class="message-input">
          <input id="msg" placeholder="Type a message" />
          <button class="btn" type="button" onclick="sendMessage()">Send</button>
        </div>
        <button class="btn" type="button" onclick="logout()">Sign Out</button>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    async function loadGames() {
      try {
        const res = await fetch('/game');
        const games = await res.json();

        const live = document.getElementById('live-games');
        const finished = document.getElementById('finished-games');

        live.innerHTML = '';
        finished.innerHTML = '';

        games.forEach((g) => {
          const card = document.createElement('div');
          card.className = 'game-card';

          const created = g.dateCreated ? new Date(g.dateCreated).toLocaleString() : 'N/A';
          const finishedAt = g.dateFinished ? new Date(g.dateFinished).toLocaleString() : '';

          card.innerHTML = `
            <div><strong>${g.teamA || 'Team A'}</strong> vs <strong>${g.teamB || 'Team B'}</strong></div>
            <div class="muted">Score: ${g.scoreA ?? '-'} - ${g.scoreB ?? '-'}</div>
            <div>Status: ${g.status}</div>
            ${g.result ? `<div>Result: ${g.result}</div>` : ''}
            <div class="muted">Created: ${created}</div>
            ${finishedAt ? `<div class="muted">Finished: ${finishedAt}</div>` : ''}
          `;

          if (g.status === 'finished') {
            finished.appendChild(card);
          } else {
            live.appendChild(card);
          }
        });
      } catch (err) {
        console.error('Error loading games:', err);
      }
    }

    loadGames();
    setInterval(loadGames, 5000);

    const socket = io();

    async function loadMessages() {
      const res = await fetch('/api/chat');
      const data = await res.json();
      const feed = document.getElementById('chat-feed');

      feed.innerHTML = '';
      data.forEach((m) => {
        feed.innerHTML += `<p><strong>${m.user}:</strong> ${m.text}</p>`;
      });
      feed.scrollTop = feed.scrollHeight;
    }
    loadMessages();

    function sendMessage() {
      const input = document.getElementById('msg');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat message', text);
      input.value = '';
    }

    socket.on('chat message', (msg) => {
      const feed = document.getElementById('chat-feed');
      feed.innerHTML += `<p><strong>${msg.user}:</strong> ${msg.text}</p>`;
      feed.scrollTop = feed.scrollHeight;
    });

    async function logout() {
      await fetch('/logout', { method: 'POST' });
      window.location.reload();
    }
  </script>
</body>
</html>
