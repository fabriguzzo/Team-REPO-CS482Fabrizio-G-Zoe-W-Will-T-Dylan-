<!DOCTYPE html>
<html>
<head>
    <title>Games Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .games-panel {
            width: 55%;
            overflow-y: scroll;
            padding: 20px;
            background: #111;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 26px;
            font-weight: bold;
            color: #FF6A00;
            margin-top: 20px;
            margin-bottom: 15px;
        }

        .game-card {
            background: #222;
            border: 2px solid #FF6A00;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
            color: white;
        }

        .game-card:hover {
            transform: scale(1.02);
            transition: 0.2s;
            cursor: pointer;
        }

        .label {
            color: #FF6A00;
            font-weight: bold;
        }

        .chat-panel {
            width: 45%;
            border-left: 3px solid #FF6A00;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            padding: 20px;
            background: #000;
        }

        #chat-feed {
            flex-grow: 1;
            border: 2px solid #FF6A00;
            padding: 10px;
            overflow-y: scroll;
            margin-bottom: 10px;
            background: #111;
            border-radius: 10px;
        }

        .chat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background: red;
            border: none;
            padding: 3px 7px;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 10px;
        }

        #msg {
            width: 75%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #FF6A00;
            background: #222;
            color: white;
        }

        button {
            padding: 10px 15px;
            background: #FF6A00;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            color: black;
        }

        button:hover {
            background: #ff8030;
        }

        #top-buttons {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            gap: 15px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="games-panel">
        <div class="section-title">LIVE GAMES</div>
        <div id="live-games"></div>

        <div class="section-title">FINISHED GAMES</div>
        <div id="finished-games"></div>
        
    </div>

    <div class="chat-panel">

        <div id="top-buttons">
            <button onclick="window.location.href='index.html'">Home</button>
            <button onclick="clearChat()">Clear Chat</button>
        </div>

        <h2 style="color:#FF6A00; margin-top:0;">Team Chat</h2>

        <div id="chat-feed"></div>

        <div>
            <input id="msg" placeholder="Type a message">
            <button onclick="sendMessage()">Send</button>
        </div>

        <button style="margin-top:15px;" onclick="logout()">Logout</button>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

async function loadGames() {
    try {
        const res = await fetch("/game");
        const games = await res.json();

        const live = document.getElementById("live-games");
        const finished = document.getElementById("finished-games");

        live.innerHTML = "";
        finished.innerHTML = "";

        games.forEach(g => {
            const card = document.createElement("div");
            card.className = "game-card";

            const created = g.dateCreated ? new Date(g.dateCreated).toLocaleString() : "N/A";
            const finishedAt = g.dateFinished ? new Date(g.dateFinished).toLocaleString() : "";

            card.innerHTML = `
                <div><span class="label">Game ID:</span> ${g._id}</div>
                <div><span class="label">Teams:</span> ${g.teamA} vs ${g.teamB}</div>
                <div><span class="label">Score:</span> ${g.scoreA} - ${g.scoreB}</div>
                <div><span class="label">Status:</span> ${g.status}</div>
                ${g.result ? `<div><span class="label">Result:</span> ${g.result}</div>` : ""}
                <div><span class="label">Created:</span> ${created}</div>
                ${finishedAt ? `<div><span class="label">Finished:</span> ${finishedAt}</div>` : ""}
            `;

            if (g.status === "finished") finished.appendChild(card);
            else live.appendChild(card);
        });

    } catch (err) {
        console.error("Error loading games:", err);
    }
}

loadGames();
//Auto Refresh
setInterval(loadGames, 5000);


//Chat Funstions
const socket = io();

async function loadMessages() {
    const res = await fetch("/api/chat");
    const messages = await res.json();
    const feed = document.getElementById("chat-feed");

    feed.innerHTML = "";

    messages.forEach(m => {
        const row = document.createElement("div");
        row.className = "chat-row";

        row.innerHTML = `
            <p><strong>${m.user}:</strong> ${m.text}</p>
            <button class="delete-btn" onclick="deleteMessage('${m._id}')">X</button>
        `;

        feed.appendChild(row);
    });
}
loadMessages();

function sendMessage() {
    const text = document.getElementById("msg").value.trim();
    if (!text) return;

    socket.emit("chat message", text);
    document.getElementById("msg").value = "";
}
// refresh after new msg
socket.on("chat message", (msg) => {
    loadMessages(); 
});

async function deleteMessage(id) {
    await fetch(`/api/chat/${id}`, { method: "DELETE" });
    loadMessages();
}

async function clearChat() {
    if (!confirm("Delete ALL chat messages?")) return;

    await fetch("/api/chat", { method: "DELETE" });
    loadMessages();
}

async function logout() {
    await fetch("/logout", { method: "POST" });
    alert("Logged out");
    window.location.reload();
}

</script>

</body>
</html>
