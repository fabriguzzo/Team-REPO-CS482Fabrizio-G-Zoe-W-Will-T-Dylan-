<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    #message {
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card form-card">
      <h1>Welcome to the Signup Page</h1>
      <p class="muted">Create an account to take control of teams, schedules, and invites.</p>
      <form id="signupForm" class="form-grid">
        <label for="name">Username</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <button type="submit" class="btn">Sign Up</button>
        <button type="reset" class="btn" style="background:#dadada; color:#333;">Reset</button>
      </form>
      <p id="message"></p>
    </section>
  </main>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');

      const user = {
        username: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch('http://localhost:4000/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
        });

        const data = await response.json();

        if (response.ok) {
          msg.style.color = 'green';
          msg.textContent = 'Signup successful!';
          document.getElementById('signupForm').reset();
        } else {
          msg.style.color = 'red';
          msg.textContent = `Error: ${data.error || 'Signup failed'}`;
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Unable to connect to server.';
        console.error(err);
      }
    });
  </script>
</body>
</html>
