<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .hint {
      margin-top: 12px;
      font-size: 14px;
      color: #555;
      text-align: center;
    }
    #message {
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link active">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card form-card">
      <h1>Login</h1>
      <p class="muted">Sign in to manage your teams, games, and dashboard access.</p>
      <form id="loginForm" class="form-grid">
        <label for="username">Username</label>
        <input type="text" id="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" required />

        <button type="submit" class="btn">Login</button>
      </form>
      <div class="hint">Don't have an account? <a href="/signup">Sign up</a>.</div>
      <p id="message"></p>
    </section>
  </main>

  <div id="accessOverlay" class="access-overlay" aria-hidden="true">
    <div class="access-modal" role="dialog" aria-modal="true" aria-labelledby="accessTitle">
      <button class="close-btn" type="button" aria-label="Close" data-close>&times;</button>
      <h3 id="accessTitle">Sign in to continue</h3>
      <p class="auth-message">Access to <strong data-tab-label>this tab</strong> requires signing in or choosing guest access.</p>
      <div class="auth-actions">
        <button class="primary" type="button" data-action="login">Log In</button>
        <button class="outline" type="button" data-action="signup">Sign Up</button>
        <button class="secondary" type="button" data-action="guest">Continue as Guest</button>
      </div>
      <p class="auth-note">Guests can only access the Games tab.</p>
      <div class="auth-error" role="alert"></div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      msg.textContent = 'Signing in...'; msg.style.color = '#333';

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await res.json();
        if (res.ok) {
          try {
            localStorage.setItem('currentUser', JSON.stringify(data.user));
            const role = (data.user && data.user.role) ? String(data.user.role).toLowerCase() : '';
            if (role !== 'child') {
              localStorage.setItem('addChildPromptPending', 'true');
            } else {
              localStorage.removeItem('addChildPromptPending');
            }
          } catch (e) {
            console.warn('Unable to persist user in localStorage', e);
          }
          msg.style.color = 'green';
          msg.textContent = 'Signed in as ' + (data.user?.username || 'user') + '. Redirecting...';
          setTimeout(() => { window.location.href = '/'; }, 800);
        } else {
          msg.style.color = 'red';
          msg.textContent = data.error || 'Login failed';
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Network error: ' + err.message;
      }
    });
  </script>
  <script>
    (function initAccessGate(){
      const overlay = document.getElementById('accessOverlay');
      if (!overlay) return;

      let labelEl = overlay.querySelector('[data-tab-label]');
      const messageEl = overlay.querySelector('.auth-message');
      const defaultMessage = messageEl ? messageEl.innerHTML : '';
      const errorEl = overlay.querySelector('.auth-error');
      const guestNote = overlay.querySelector('.auth-note');
      const defaultNote = guestNote ? guestNote.textContent : '';
      const closeBtn = overlay.querySelector('[data-close]');
      const loginBtn = overlay.querySelector('[data-action="login"]');
      const signupBtn = overlay.querySelector('[data-action="signup"]');
      const guestBtn = overlay.querySelector('[data-action="guest"]');

      let pendingHref = '';
      let pendingLabel = '';
      let overlayGuestBlocked = false;

      function safeUser(){
        try { return JSON.parse(localStorage.getItem('currentUser') || 'null'); }
        catch (_) { return null; }
      }

      function isLoggedIn(){
        const user = safeUser();
        const signedIn = !!(user && user.username);
        if (signedIn) {
          try { localStorage.removeItem('guestMode'); } catch (_) {}
        }
        return signedIn;
      }

      function isGuestMode(){
        try { return localStorage.getItem('guestMode') === 'games-only'; }
        catch (_) { return false; }
      }

      function allowedForGuest(href){
        if (!href) return false;
        try {
          const path = new URL(href, window.location.origin).pathname.toLowerCase();
          const clean = path.replace(/\/+$/, '');
          return clean === '/viewgames' || clean === '/viewgames.html' || clean === '/games';
        } catch (_) {
          return false;
        }
      }

      function setLabel(value){
        if (labelEl) labelEl.textContent = value || 'this tab';
      }

      function openOverlay(options = {}){
        overlayGuestBlocked = !!options.guestBlocked;
        overlay.classList.add('active');

        if (overlayGuestBlocked) {
          if (messageEl) {
            const target = pendingLabel || 'this tab';
            messageEl.innerHTML = `You are browsing as <strong>Guest</strong>. Log in or sign up to access <strong>${target}</strong>.`;
          }
          if (guestBtn) guestBtn.style.display = 'none';
          if (guestNote) guestNote.textContent = 'Guests can only open the Games tab. Please sign in for full access.';
        } else {
          if (messageEl) {
            messageEl.innerHTML = defaultMessage;
            labelEl = overlay.querySelector('[data-tab-label]');
          }
          if (guestBtn) guestBtn.style.display = '';
          if (guestNote) guestNote.textContent = defaultNote;
          setLabel(pendingLabel || 'this tab');
        }

        if (errorEl) errorEl.textContent = '';
      }

      function closeOverlay(){
        overlay.classList.remove('active');
        if (errorEl) errorEl.textContent = '';
        pendingHref = '';
        overlayGuestBlocked = false;
      }

      function attachHandlers(links){
        links.forEach(link => {
          link.addEventListener('click', evt => {
            const href = link.getAttribute('href') || link.href;
            if (!href) return;
            if (href.startsWith('#')) return;
            if (isLoggedIn()) return;
            const guestBlocked = isGuestMode() && !allowedForGuest(href);
            if (isGuestMode() && !guestBlocked) return;
            evt.preventDefault();
            pendingHref = href;
            pendingLabel = link.textContent.trim();
            openOverlay({ guestBlocked });
          });
        });
      }

      const navLinks = Array.from(document.querySelectorAll('.top-nav a:not(.auth-link)'));
      const flaggedLinks = Array.from(document.querySelectorAll('[data-requires-auth="true"]'));
      const uniqueLinks = [...new Set([...navLinks, ...flaggedLinks])];
      if (!uniqueLinks.length) return;

      attachHandlers(uniqueLinks);

      if (closeBtn) closeBtn.addEventListener('click', closeOverlay);
      overlay.addEventListener('click', evt => {
        if (evt.target === overlay) closeOverlay();
      });

      document.addEventListener('keydown', evt => {
        if (evt.key === 'Escape' && overlay.classList.contains('active')) closeOverlay();
      });

      if (loginBtn) loginBtn.addEventListener('click', () => { window.location.href = '/login'; });
      if (signupBtn) signupBtn.addEventListener('click', () => { window.location.href = '/signup'; });
      if (guestBtn) {
        guestBtn.addEventListener('click', () => {
          if (overlayGuestBlocked) {
            if (errorEl) errorEl.textContent = 'Guest access is limited to the Games tab.';
            return;
          }
          if (allowedForGuest(pendingHref)) {
            try { localStorage.setItem('guestMode', 'games-only'); } catch (_) {}
            window.location.href = pendingHref;
            closeOverlay();
          } else if (errorEl) {
            errorEl.textContent = 'Guest access is limited to the Games tab.';
          }
        });
      }
    })();
  </script>
</body>
</html>
