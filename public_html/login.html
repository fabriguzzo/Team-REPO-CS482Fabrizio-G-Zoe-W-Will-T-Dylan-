<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .hint {
      margin-top: 12px;
      font-size: 14px;
      color: #555;
      text-align: center;
    }
    #message {
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link active">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card form-card">
      <h1>Login</h1>
      <p class="muted">Sign in to manage your teams, games, and dashboard access.</p>
      <form id="loginForm" class="form-grid">
        <label for="username">Username</label>
        <input type="text" id="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" required />

        <button type="submit" class="btn">Login</button>
      </form>
      <div class="hint">Don't have an account? <a href="/signup">Sign up</a>.</div>
      <p id="message"></p>
    </section>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      msg.textContent = 'Signing in...'; msg.style.color = '#333';

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await res.json();
        if (res.ok) {
          try {
            localStorage.setItem('currentUser', JSON.stringify(data.user));
            const role = (data.user && data.user.role) ? String(data.user.role).toLowerCase() : '';
            if (role !== 'child') {
              localStorage.setItem('addChildPromptPending', 'true');
            } else {
              localStorage.removeItem('addChildPromptPending');
            }
          } catch (e) {
            console.warn('Unable to persist user in localStorage', e);
          }
          msg.style.color = 'green';
          msg.textContent = 'Signed in as ' + (data.user?.username || 'user') + '. Redirecting...';
          setTimeout(() => { window.location.href = '/'; }, 800);
        } else {
          msg.style.color = 'red';
          msg.textContent = data.error || 'Login failed';
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Network error: ' + err.message;
      }
    });
  </script>
</body>
</html>
