<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Child (Player)</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    #message {
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card form-card">
      <h1>Register a Child (Player)</h1>
      <p class="muted">Parents can quickly add youth accounts and tie them to their profile for roster management.</p>
      <form id="childForm" class="form-grid">
        <label for="parentId">Parent ID</label>
        <input type="text" id="parentId" placeholder="Parent user id (ObjectId)" required />

        <label for="username">Child Username</label>
        <input type="text" id="username" placeholder="Username" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email" required />

        <button type="submit" class="btn">Create Child</button>
      </form>

      <p id="message"></p>
    </section>
  </main>

  <script>
    (function prefillParent(){
      try {
        const u = JSON.parse(localStorage.getItem('currentUser') || 'null');
        if (u && u._id) {
          const parentInput = document.getElementById('parentId');
          if (parentInput && !parentInput.value) parentInput.value = u._id;
        }
      } catch (_) {}
    })();

    document.getElementById('childForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const parentId = document.getElementById('parentId').value.trim();
      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
        email: document.getElementById('email').value.trim()
      };

      const msg = document.getElementById('message');
      msg.textContent = 'Creating child...';

      try {
        const res = await fetch(`/users/${encodeURIComponent(parentId)}/children`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          msg.style.color = 'green';
          msg.textContent = 'Child created successfully: ' + (data._id || data.username || '');
          document.getElementById('childForm').reset();
        } else {
          msg.style.color = 'red';
          msg.textContent = 'Error: ' + (data.error || JSON.stringify(data));
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Network error: ' + err.message;
      }
    });
  </script>
</body>
</html>
