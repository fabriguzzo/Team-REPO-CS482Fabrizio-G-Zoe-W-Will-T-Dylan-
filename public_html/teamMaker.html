<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Team</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    #message {
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card form-card">
      <h1>Add a Team</h1>
      <p class="muted">Spin up a roster quickly with a name, manager, and optional logo.</p>
      <form id="teamForm" class="form-grid" enctype="multipart/form-data">
        <label for="name">Team Name</label>
        <input type="text" id="name" name="name" placeholder="Team Name" required />

        <label for="manager">Manager</label>
        <input type="text" id="manager" name="manager" placeholder="Manager" />

        <label for="logo">Upload Logo</label>
        <input type="file" id="logo" name="logo" accept="image/*" />

        <button type="submit" class="btn">Add Team</button>
      </form>
      <p id="message"></p>
    </section>
  </main>

  <script>
    document.getElementById('teamForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData();
      formData.append('name', document.getElementById('name').value);
      formData.append('manager', document.getElementById('manager').value);
      const logoFile = document.getElementById('logo').files[0];
      if (logoFile) {
        formData.append('logo', logoFile);
      }

      const response = await fetch('http://localhost:4000/teams', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      const msg = document.getElementById('message');

      if (response.ok) {
        msg.style.color = 'green';
        msg.textContent = 'Team added successfully!';
        document.getElementById('teamForm').reset();
      } else {
        msg.style.color = 'red';
        msg.textContent = `Error: ${data.error || 'Failed to add team'}`;
      }
    });
  </script>
</body>
</html>
