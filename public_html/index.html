<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball League</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background: #1b4332;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 32px;
        }
        .container {
            display: grid;
            grid-template-columns: 200px 1fr 250px;
            gap: 20px;
            padding: 20px;
        }
        
        .side-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .nav-btn {
            display: block;
            padding: 15px;
            background: #2d6a4f;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            transition: 0.2s;
        }
        .nav-btn:hover {
            background: #1b4332;
            transform: scale(1.05);
        }
        
        .calendar {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .calendar table {
            width: 100%;
            border-collapse: collapse;
        }
        .calendar td, .calendar th {
            border: 1px solid #ccc;
            height: 50px;
            text-align: center;
        }
        .dot {
            width: 10px;
            height: 10px;
            background: #1b4332;
            border-radius: 50%;
            margin: auto;
        }
        
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .login-box a {
            display: block;
            padding: 10px;
            background: #40916c;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .feed {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .feed-item {
            background: #eeeeee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <header>Baseball League</header>

    <div class="container">

        
        <div class="side-buttons">
            <a href="/andGame" class="nav-btn">Games</a>
            <a href="/viewTeams" class="nav-btn">Teams</a>
        </div>

        
        <div class="calendar">
        <table id="calendarTable"></table>
        </div>


        <script>
        const calendarTable = document.getElementById("calendarTable");
        const monthName = document.getElementById("monthName");


        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth();


        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        monthName.textContent = monthNames[month] + " " + year;


        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();


        let tableHTML = "<tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr><tr>";


        for (let i = 0; i < firstDay; i++) tableHTML += "<td></td>";


        let day = 1;
        for (let i = firstDay; i < 7; i++) {
        tableHTML += `<td>${day}</td>`;
        day++;
        }
        tableHTML += "</tr>";


        while (day <= daysInMonth) {
        tableHTML += "<tr>";
        for (let i = 0; i < 7 && day <= daysInMonth; i++) {
        tableHTML += `<td>${day}</td>`;
        day++;
        }
        tableHTML += "</tr>";
        }


        calendarTable.innerHTML = tableHTML;
        </script></td><td></td><td></td></tr>
        <tr><td></td><td></td><td></td><td></td><td><div class="dot"></div></td></tr>
        <tr><td><div class="dot"></div></td><td></td><td></td><td></td><td></td></tr>
        </table>
        </div>

        
        <div class="right-panel">
            <div class="login-box">
                <h3>Login</h3>
                <a href="/login">Sign In</a>
                <a href="/signup">Sign Up</a>
            </div>
        </div>
    </div>

    
    <div class="feed">
        <h2>Feed</h2>
        <div class="feed-item">User posted a video/picture</div>
        <div class="feed-item">User posted a video/picture</div>
        <div class="feed-item">User posted a video/picture</div>
    </div>

</body>
</html>
