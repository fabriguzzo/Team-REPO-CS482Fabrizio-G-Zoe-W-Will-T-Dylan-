<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball League</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background: #a64b00;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 32px;
        }
        .container {
            display: grid;
            grid-template-columns: 200px 1fr 250px;
            gap: 20px;
            padding: 20px;
        }
        .side-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .nav-btn {
            display: block;
            padding: 15px;
            background: #ff8c00;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            transition: 0.2s;
        }
        .nav-btn:hover {
            background: #a64b00;
            transform: scale(1.05);
        }

        .calendar {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.12);
        }
        #monthHeader {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th {
            color: #555;
            padding-bottom: 10px;
        }
        td {
            height: 55px;
            border-radius: 10px;
            transition: 0.15s;
        }
        td:hover {
            background: #d8f3dc;
            cursor: pointer;
        }
        .today {
            background: #74c69d;
            color: white;
            font-weight: bold;
            border-radius: 50%;
        }

        .day-cell { position: relative; }
        .day-cell .game-dot {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #ff8c00;
            border-radius: 50%;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .overlay.active { display: flex; }
        .modal {
            background: #fff;
            width: 420px;
            max-width: 92vw;
            border-radius: 12px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.25);
            padding: 18px 16px;
        }
        .modal-header { font-weight: 700; margin-bottom: 10px; display:flex; justify-content: space-between; align-items:center; }
        .modal-close { border: none; background: transparent; font-size: 22px; cursor: pointer; line-height: 1; }
        .game-list { max-height: 50vh; overflow: auto; margin-top: 6px; }
        .game-item { padding: 10px; border: 1px solid #eee; border-radius: 8px; margin: 8px 0; background: #fffaf5; }
        .game-item .status { font-size: 12px; color: #666; }
        .blurred { filter: blur(3px); }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .login-box a {
            display: block;
            padding: 10px;
            background: #ffa64d;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            margin-top: 10px;
        }

        .feed {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .feed-item {
            background: #fff2e6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<header>Baseball League</header>

<div id="mainContent" class="container">
    <div class="side-buttons">
        <a href="/viewGames" class="nav-btn">Games</a>
        <a href="/addGame" class="nav-btn">Update Game</a>
        <a href="/viewTeams" class="nav-btn">Teams</a>
        <a href="/addTeam" class="nav-btn">Add team</a>

    </div>

    <div class="calendar">
        <div id="monthHeader"></div>
        <table id="calendarTable"></table>
    </div>

    <div class="right-panel">
        <div class="login-box">
                <h3>Login</h3>
                <a href="/login">Sign In</a>
                <a href="/signup">Sign Up</a>
                <a href="/guest" class="guest-btn">Guest User</a>
            </div>
    </div>
</div>

<div class="feed">
    <h2>Feed</h2>
    <div class="feed-item">User posted a video/picture</div>
    <div class="feed-item">User posted a video/picture</div>
    <div class="feed-item">User posted a video/picture</div>
</div>

<script>
    const table = document.getElementById("calendarTable");
    const header = document.getElementById("monthHeader");

    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    header.textContent = `${monthNames[month]} ${year}`;
    function toKey(y, m, d) {
      const mm = String(m + 1).padStart(2, '0');
      const dd = String(d).padStart(2, '0');
      return `${y}-${mm}-${dd}`;
    }

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let html = `<tr>
        <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
    </tr><tr>`;

    for (let i = 0; i < firstDay; i++) html += "<td></td>";

    let day = 1;
    for (let i = firstDay; i < 7; i++) {
        const isToday = day === today.getDate();
        const dateKey = toKey(year, month, day);
        html += `<td class="day-cell ${isToday ? 'today' : ''}" data-date="${dateKey}">${day}</td>`;
        day++;
    }
    html += "</tr>";

    while (day <= daysInMonth) {
        html += "<tr>";
        for (let i = 0; i < 7 && day <= daysInMonth; i++) {
            const isToday = day === today.getDate();
            const dateKey = toKey(year, month, day);
            html += `<td class="day-cell ${isToday ? 'today' : ''}" data-date="${dateKey}">${day}</td>`;
            day++;
        }
        html += "</tr>";
    }

    table.innerHTML = html;

    // Map games by YYYY-MM-DD
    const gamesByDate = {};
    function dateKeyFromISO(iso) {
      if (!iso) return null;
      const dt = new Date(iso);
      return toKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
    }
    async function loadGamesAndBind() {
      try {
        const res = await fetch('/game');
        const data = await res.json();
        if (!res.ok || !Array.isArray(data)) return;
        data.forEach(g => {
          const key = dateKeyFromISO(g.dateCreated);
          if (!key) return;
          if (!gamesByDate[key]) gamesByDate[key] = [];
          gamesByDate[key].push(g);
        });
        // Mark cells and bind clicks
        document.querySelectorAll('td.day-cell').forEach(td => {
          const key = td.getAttribute('data-date');
          if (gamesByDate[key] && gamesByDate[key].length) {
            const dot = document.createElement('span');
            dot.className = 'game-dot';
            td.appendChild(dot);
          }
          td.addEventListener('click', () => openDayModal(key));
        });
      } catch (e) {
        console.warn('Failed to load games', e);
      }
    }
    // Overlay modal
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <span id="modalDate">Day</span>
          <button class="modal-close" aria-label="Close">×</button>
        </div>
        <div class="game-list" id="gameList"></div>
      </div>`;
    document.body.appendChild(overlay);
    function openDayModal(key) {
      const main = document.getElementById('mainContent');
      const list = document.getElementById('gameList');
      const dateEl = document.getElementById('modalDate');
      const pretty = new Date(key).toDateString();
      dateEl.textContent = pretty;
      list.innerHTML = '';
      const items = gamesByDate[key] || [];
      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'game-item';
        empty.textContent = 'No games on this day.';
        list.appendChild(empty);
      } else {
        items.forEach(g => {
          const item = document.createElement('div');
          item.className = 'game-item';
          const status = g.status || 'unknown';
          const score = (typeof g.scoreA === 'number' && typeof g.scoreB === 'number') ? ` (${g.scoreA}-${g.scoreB})` : '';
          item.innerHTML = `<div><strong>${g.teamA || 'Team A'}</strong> vs <strong>${g.teamB || 'Team B'}</strong>${score}</div><div class="status">Status: ${status}</div>`;
          list.appendChild(item);
        });
      }
      overlay.classList.add('active');
      if (main) main.classList.add('blurred');
    }
    function closeModal() {
      const main = document.getElementById('mainContent');
      overlay.classList.remove('active');
      if (main) main.classList.remove('blurred');
    }
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay || e.target.classList.contains('modal-close')) {
        closeModal();
      }
    });
    loadGamesAndBind();
</script>

<script>
  (function renderAuthBox(){
    const box = document.querySelector('.login-box');
    if (!box) return;
    let user = null;
    try { user = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch (_) {}
    if (!user || !user.username) return; // leave default links for signed-out users

    const role = user.role ? ` (Role: ${user.role})` : '';
    const addChildLink = `<a href="/addChild">Add Child</a>`;
    const signOutBtn = `<button id="signOutBtn" style="margin-top:10px;">Sign Out</button>`;

    box.innerHTML = `
      <h3>Account</h3>
      <div>Signed in as <strong>${user.username}</strong>${role}</div>
      ${addChildLink}
      ${signOutBtn}
    `;

    const btn = document.getElementById('signOutBtn');
    if (btn) btn.addEventListener('click', function(){
      try { localStorage.removeItem('currentUser'); } catch (_) {}
      location.reload();
    });
  })();
  </script>

</body>
</html>
