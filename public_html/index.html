<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball League</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background: #a64b00;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 32px;
        }
        .container {
            display: grid;
            grid-template-columns: 200px 1fr 250px;
            gap: 20px;
            padding: 20px;
        }
        .side-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .nav-btn {
            display: block;
            padding: 15px;
            background: #ff8c00;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            transition: 0.2s;
        }
        .nav-btn:hover {
            background: #a64b00;
            transform: scale(1.05);
        }

        /* NEW CALENDAR DESIGN */
        .calendar {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.12);
        }
        #monthHeader {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th {
            color: #555;
            padding-bottom: 10px;
        }
        td {
            height: 55px;
            border-radius: 10px;
            transition: 0.15s;
        }
        td:hover {
            background: #d8f3dc;
            cursor: pointer;
        }
        .today {
            background: #74c69d;
            color: white;
            font-weight: bold;
            border-radius: 50%;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .login-box a {
            display: block;
            padding: 10px;
            background: #ffa64d;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            margin-top: 10px;
        }

        .feed {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .feed-item {
            background: #fff2e6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<header>Baseball League</header>

<div class="container">
    <div class="side-buttons">
        <a href="/addGame" class="nav-btn">Games</a>
        <a href="/viewTeams" class="nav-btn">Teams</a>
    </div>

    <!-- BEAUTIFUL CALENDAR -->
    <div class="calendar">
        <div id="monthHeader"></div>
        <table id="calendarTable"></table>
    </div>

    <div class="right-panel">
        <div class="login-box">
                <h3>Login</h3>
                <a href="/login">Sign In</a>
                <a href="/signup">Sign Up</a>
                <a href="/guest" class="guest-btn">Guest User</a>
            </div>
    </div>
</div>

<div class="feed">
    <h2>Feed</h2>
    <div class="feed-item">User posted a video/picture</div>
    <div class="feed-item">User posted a video/picture</div>
    <div class="feed-item">User posted a video/picture</div>
</div>

<script>
    const table = document.getElementById("calendarTable");
    const header = document.getElementById("monthHeader");

    const today = new Date();
    const year = today.getFullYear();
    const month = today.getMonth();
    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    header.textContent = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let html = `<tr>
        <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
    </tr><tr>`;

    for (let i = 0; i < firstDay; i++) html += "<td></td>";

    let day = 1;
    for (let i = firstDay; i < 7; i++) {
        const isToday = day === today.getDate();
        html += `<td class="${isToday ? 'today' : ''}">${day}</td>`;
        day++;
    }
    html += "</tr>";

    while (day <= daysInMonth) {
        html += "<tr>";
        for (let i = 0; i < 7 && day <= daysInMonth; i++) {
            const isToday = day === today.getDate();
            html += `<td class="${isToday ? 'today' : ''}">${day}</td>`;
            day++;
        }
        html += "</tr>";
    }

    table.innerHTML = html;
</script>

</body>
</html>
