<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All Users</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    #usersContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .user-card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }
    .user-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-dark);
    }
    #message {
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card">
      <div class="toolbar" style="justify-content: space-between;">
        <div>
          <h1>User List</h1>
          <p class="muted">Snapshot of everyone in the league.</p>
        </div>
        <button class="btn" type="button" onclick="loadUsers()">Reload Users</button>
      </div>
      <div id="usersContainer"></div>
      <p id="message"></p>
    </section>
  </main>

  <script>
    async function loadUsers() {
      const container = document.getElementById('usersContainer');
      const msg = document.getElementById('message');
      container.innerHTML = '';
      msg.textContent = '';

      try {
        const response = await fetch('http://localhost:4000/users');
        const data = await response.json();

        if (!response.ok) {
          msg.style.color = 'red';
          msg.textContent = `Error: ${data.error || 'Failed to load users'}`;
          return;
        }

        if (data.length === 0) {
          msg.textContent = 'No users found.';
          return;
        }

        data.forEach((user) => {
          const card = document.createElement('div');
          card.className = 'user-card';

          const name = document.createElement('div');
          name.className = 'user-name';
          name.textContent = user.username;
          card.appendChild(name);

          const email = document.createElement('div');
          email.className = 'user-email';
          email.textContent = user.email || 'No email';
          card.appendChild(email);

          const role = document.createElement('div');
          role.className = 'user-role';
          role.textContent = `Role: ${user.role || 'User'}`;
          card.appendChild(role);

          container.appendChild(card);
        });
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Error connecting to server.';
        console.error(err);
      }
    }
    window.onload = loadUsers;
  </script>
</body>
</html>
