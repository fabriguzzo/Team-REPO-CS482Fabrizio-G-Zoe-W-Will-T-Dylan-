<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game Manager</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .manager-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }
    form.card input,
    form.card select {
      width: 100%;
    }
    #message {
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="/">Baseball League</a></div>
    <nav class="top-nav">
      <a href="/viewGames">Games</a>
      <a href="/viewTeams">Teams</a>
      <a href="/schedule">Schedule</a>
      <a href="/login" class="auth-link">Login</a>
      <a href="/signup" class="auth-link accent">Sign Up</a>
      <a href="/guest" class="auth-link">Guest</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card">
      <h1>Game Manager</h1>
      <p class="muted">Create matchups, update scores, and close out games. Everything stays in sync with the schedule and live scoreboard.</p>
    </section>

    <div class="manager-grid">
      <form id="createGameForm" class="card form-grid">
        <h2>Create New Game</h2>
        <input type="text" id="teamA" placeholder="Team A Name" required />
        <input type="text" id="teamB" placeholder="Team B Name" required />
        <button type="submit" class="btn">Create Game</button>
      </form>

      <form id="manageGameForm" class="card form-grid">
        <h2>Manage Current Game</h2>
        <select id="gameDropdown">
          <option value="">-- Select a Game --</option>
        </select>
        <input type="number" id="scoreA" placeholder="Score A" />
        <input type="number" id="scoreB" placeholder="Score B" />
        <button type="button" class="btn" onclick="updateScore()">Update Score</button>
        <button type="button" class="btn" onclick="finishGame()">Finish Game</button>
      </form>
    </div>

    <p id="message"></p>
  </main>

  <script>
    const BASE_URL = 'http://localhost:4000/game';
    let games = [];

    document.getElementById('createGameForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const game = {
        teamA: document.getElementById('teamA').value,
        teamB: document.getElementById('teamB').value
      };

      const response = await fetch(BASE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(game)
      });

      const data = await response.json();
      const msg = document.getElementById('message');

      if (response.ok) {
        msg.style.color = 'green';
        msg.textContent = `Game created: ${data.teamA} vs ${data.teamB}`;
        document.getElementById('createGameForm').reset();
        loadGames();
      } else {
        msg.style.color = 'red';
        msg.textContent = `Error: ${data.error || 'Failed to create a game'}`;
      }
    });

    async function loadGames() {
      const dropdown = document.getElementById('gameDropdown');
      dropdown.innerHTML = '<option value="">-- Select a Game --</option>';
      const msg = document.getElementById('message');
      msg.textContent = '';

      try {
        const response = await fetch(BASE_URL);
        const data = await response.json();

        if (!response.ok) {
          msg.style.color = 'red';
          msg.textContent = 'Error loading games.';
          return;
        }

        games = data.filter((g) => g.status === 'in-progress');

        if (games.length === 0) {
          msg.textContent = 'No active games found.';
          return;
        }

        games.forEach((g) => {
          const opt = document.createElement('option');
          opt.value = g._id;
          opt.textContent = `${g.teamA} vs ${g.teamB} (${g.scoreA}-${g.scoreB})`;
          dropdown.appendChild(opt);
        });
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Error connecting to server.';
        console.error(err);
      }
    }

    async function updateScore() {
      const id = document.getElementById('gameDropdown').value;
      const msg = document.getElementById('message');
      if (!id) {
        msg.textContent = 'Select a game first.';
        return;
      }

      const scores = {
        scoreA: parseInt(document.getElementById('scoreA').value),
        scoreB: parseInt(document.getElementById('scoreB').value)
      };

      try {
        const response = await fetch(`${BASE_URL}/${id}/score`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(scores)
        });

        const data = await response.json();

        if (response.ok) {
          msg.style.color = 'green';
          msg.textContent = `Score updated: ${data.scoreA}-${data.scoreB}`;
          loadGames();
        } else {
          msg.style.color = 'red';
          msg.textContent = `Error: ${data.error || 'Failed to update score'}`;
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Error connecting to server.';
        console.error(err);
      }
    }

    async function finishGame() {
      const id = document.getElementById('gameDropdown').value;
      const msg = document.getElementById('message');
      if (!id) {
        msg.textContent = 'Select a game to finish.';
        return;
      }

      const finalScores = {
        scoreA: parseInt(document.getElementById('scoreA').value),
        scoreB: parseInt(document.getElementById('scoreB').value)
      };

      try {
        const response = await fetch(`${BASE_URL}/${id}/finish`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(finalScores)
        });

        const data = await response.json();

        if (response.ok) {
          msg.style.color = 'green';
          msg.textContent = `Game finished! ${data.game?.result || 'Check database.'}`;
          loadGames();
        } else {
          msg.style.color = 'red';
          msg.textContent = `Error: ${data.error || 'Failed to finish game'}`;
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Error connecting to server.';
        console.error(err);
      }
    }

    window.onload = loadGames;
  </script>
</body>
</html>
